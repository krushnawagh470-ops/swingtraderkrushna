name: SPIDER Firebase Preview

on:
  push:
    branches:
      - security/owner-auth-google-email
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spider-firebase-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Stage frontend-only hosting files
        run: |
          mkdir -p hosting/assets hosting/data
          cp index.html auth.js firebase-config.js memory.js manifest.webmanifest sw.js hosting/
          mkdir -p hosting/icons
          cp icons/spider.svg hosting/icons/
          cp assets/spider-agent.mp4 hosting/assets/
          cp data/calendar.json data/forex_factory_calendar.json hosting/data/

      - name: Verify Firebase deploy identity (non-secret fields only)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPIDER_121 }}
        run: |
          node -e 'const k=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT); console.log("Firebase key project_id:", k.project_id); console.log("Firebase key client_email:", k.client_email); if (k.project_id !== "spider-121") process.exit(1)'

      - name: Deploy isolated Firebase preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPIDER_121 }}
          projectId: spider-121
          channelId: spider-auth-preview
          expires: 7d
