name: Refresh terminal market data
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-market-data.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: terminal-market-data
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch free live news and calendar data
        run: python scripts/fetch_market_data.py
      - name: Publish data snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/calendar.json
          if git diff --cached --quiet; then
            echo "No market data changes."
          else
            git commit -m "chore: refresh terminal news and calendar data"
            # Rebase the generated snapshot commit if another workflow or user
            # update reached main while the live data was being fetched.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push raced with another main-branch update (attempt $attempt). Retrying."
              sleep 2
            done
            echo "::error::Could not publish refreshed market data after 3 attempts."
            exit 1
          fi
