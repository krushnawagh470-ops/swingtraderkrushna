name: Python backend checks
on:
  push:
    paths:
      - 'backend/**'
      - 'worker.js'
      - 'auth.js'
      - 'memory.js'
      - 'index.html'
      - 'firebase-config.js'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'worker.js'
      - 'auth.js'
      - 'memory.js'
      - 'index.html'
      - 'firebase-config.js'
      - '.github/workflows/backend-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: PYTHONPATH=. pytest -q
      - name: Check Worker and browser JavaScript syntax
        run: for file in ../worker.js ../auth.js ../memory.js; do node --check "$file"; done
