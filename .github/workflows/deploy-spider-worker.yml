name: Deploy SPIDER Core to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "migrations/0001_circuit_memory.sql"
      - ".github/workflows/deploy-spider-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spider-core-v2-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < worker.js

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Find the existing SPIDER D1 database and build Wrangler config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          DB_LIST="$(wrangler d1 list --json)"
          DB_META="$(printf '%s' "$DB_LIST" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const parsed = JSON.parse(raw);
              const rows = Array.isArray(parsed) ? parsed : (parsed.result || []);
              const target = rows.find(db =>
                String(db.name || "").toLowerCase().replace(/[^a-z0-9]/g, "") === "circuitmemory"
              );
              console.log(target ? JSON.stringify({ id: target.uuid || target.database_id || "", name: target.name }) : "");
            });
          ')"
          if [ -z "$DB_META" ]; then
            echo "::error::Could not find the existing D1 database named 'circuit-memory' (or 'circuit memory'). No deployment was made."
            exit 1
          fi
          node - "$DB_META" <<'NODE'
          const fs = require("node:fs");
          const database = JSON.parse(process.argv[2]);
          const config = {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "spider-core-v2",
            "main": "worker.js",
            "compatibility_date": "2026-11-10",
            "keep_vars": true,
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": database.name,
                "database_id": database.id
              }
            ]
          };
          fs.writeFileSync(".wrangler-ci.jsonc", JSON.stringify(config, null, 2) + "\n");
          fs.appendFileSync(process.env.GITHUB_ENV, "DB_NAME=" + database.name + "\n");
          NODE

      - name: Validate deployment bundle without publishing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config .wrangler-ci.jsonc --dry-run --keep-vars

      - name: Apply SPIDER memory database migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute "$DB_NAME" --remote --file migrations/0001_circuit_memory.sql

      - name: Deploy SPIDER Core v2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config .wrangler-ci.jsonc --keep-vars

      - name: Smoke-test SPIDER health and live search
        env:
          WORKER_URL: https://spider-core-v2.swingtraderkrushna.workers.dev
        run: |
          curl --fail --silent --show-error "$WORKER_URL/health" > /tmp/spider-health.json
          node -e 'const d=require("/tmp/spider-health.json"); if(!d.ok || !d.configured || !d.memoryConfigured) process.exit(1); console.log("SPIDER Core health OK:", d.build);'
          curl --fail --silent --show-error "$WORKER_URL/search?q=Bureau%20of%20Labor%20Statistics%20CPI%20release" > /tmp/spider-search.json
          node -e 'const d=require("/tmp/spider-search.json"); if(!d.ok || !Array.isArray(d.results) || !d.results.length) process.exit(1); console.log("Live search OK:", d.results.length, "sources");'
